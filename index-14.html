body.dark{--bg:#17110c;--card:#231a13;--tx:#f3ebe0;--mu:#b3a08c;--bd:#3a2c20;--pri2:#2e2218;--pri:#a2602c;--acc:#e0a76d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;cursor:pointer}
input,select,textarea{cursor:text;width:100%;background:var(--pri2);border-radius:12px;padding:13px 14px;font-size:15px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:900px;margin:auto;padding:0 16px}
.screen{display:none;padding-top:18px}.screen.on{display:block}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:19px;font-weight:800;color:var(--acc);flex:1;display:flex;align-items:center;gap:10px;min-width:0}
header h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:var(--logo) center/cover;box-shadow:0 2px 8px rgba(122,77,40,.3)}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:grid;place-items:center;position:relative}
.ib svg,.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.hero{background:linear-gradient(125deg,#6b4122 0%,#9a6435 55%,#c8935a 100%);color:#fff;border-radius:26px;padding:26px;margin:6px 0 18px}
.hero h2{font-size:26px;line-height:1.3;font-weight:800;max-width:15em}

<script>
(function(){
var o=document.getElementById('offline'),b=document.getElementById('offb'),fails=0;
function show(){o.classList.add('on')}
function hide(){o.classList.remove('on')}
function ping(){return new Promise(function(res){
  if(!navigator.onLine)return res(false);
  var c=new AbortController(),t=setTimeout(function(){c.abort()},6000);
  fetch('https://www.gstatic.com/generate_204',{mode:'no-cors',cache:'no-store',signal:c.signal})
   .then(function(){clearTimeout(t);res(true)}).catch(function(){clearTimeout(t);res(false)})})}
function back(){fails=0;
  if(typeof firebase==='undefined'||typeof loadP!=='function'){location.reload();return}
  hide();try{loadP();loadBanner()}catch(e){}}
async function check(){var ok=await ping();
  if(ok){fails=0;if(o.classList.contains('on'))back()}
  else{fails++;if(fails>=2||!navigator.onLine)show()}}
window.netRetry=async function(){b.disabled=true;b.textContent='جارٍ التحقق...';
  var ok=await ping();b.disabled=false;b.textContent='إعادة المحاولة';
  if(ok)back();else show()};
addEventListener('offline',show);
addEventListener('online',check);
addEventListener('load',function(){if(typeof firebase==='undefined')show()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
setInterval(function(){if(!document.hidden)check()},20000);
if(!navigator.onLine)show();
})();
</script>

<script>
firebase.initializeApp({apiKey:"AIzaSyBgMhcy02KakV79L9pdzayojZlRdH3w9RE",authDomain:"matjark-a7d67.firebaseapp.com",projectId:"matjark-a7d67",storageBucket:"matjark-a7d67.firebasestorage.app",messagingSenderId:"552177523279",appId:"1:552177523279:web:9eec81246272935f42683a"});
let LANG=(()=>{try{return JSON.parse(localStorage.getItem('lang'))==='en'?'en':'ar'}catch{return'ar'}})();document.documentElement.lang=LANG;document.documentElement.dir=LANG==='en'?'ltr':'rtl';
const auth=firebase.auth(),db=firebase.firestore();
try{db.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}
const FSB='https://firestore.googleapis.com/v1/projects/matjark-a7d67/databases/(default)/documents/';
function fsV(v){if('stringValue'in v)return v.stringValue;if('integerValue'in v)return +v.integerValue;if('doubleValue'in v)return v.doubleValue;if('booleanValue'in v)return v.booleanValue;if('timestampValue'in v)return Date.parse(v.timestampValue);if('arrayValue'in v)return(v.arrayValue.values||[]).map(fsV);if('mapValue'in v)return fsO(v.mapValue.fields||{});return null}
function fsO(f){const o={};for(const k in f)o[k]=fsV(f[k]);return o}
async function fsGetJ(u){const k=u==='settings/banner'?'b':u==='products?pageSize=300'?'p':null;if(k&&window.__pf&&window.__pf[k]){const x=window.__pf[k];window.__pf[k]=null;const j=await x;if(j)return j}const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);try{const r=await fetch(FSB+u,{signal:c.signal});if(r.status===404)return null;if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function fsList(col){let a=[],tk='';do{const j=await fsGetJ(col+'?pageSize=300'+(tk?'&pageToken='+encodeURIComponent(tk):''));(j.documents||[]).forEach(d=>a.push({id:d.name.split('/').pop(),...fsO(d.fields||{})}));tk=j.nextPageToken}while(tk);return a}
async function fsDoc(p){const j=await fsGetJ(p);return j?fsO(j.fields||{}):null}
try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){console.warn('persistence',e)})}catch(e){}
const FREE_SHIP=50, SHIP_FEE=3;
const FOOT='<p style="text-align:center;color:var(--mu);font-size:12px;margin:24px 0 8px">جميع الحقوق محفوظة · مؤسسة الملك التجارية © 2026</p>';
const REQUIRE_PHONE_VERIFY=false;
const REQUIRE_EMAIL_VERIFY=true; // ← false لإيقاف إلزام تأكيد البريد // ← اجعلها false لإيقاف إلزام توثيق الهاتف
const CATS=[['all','الكل'],['gifts','الهدايا'],['electronics','إلكترونيات'],['home','منزلية'],['beauty','مكياج'],['toys','ألعاب'],['cleaning','منظفات']];
const STEPS=[['pending','قيد المراجعة'],['processing','قيد التجهيز'],['shipped','تم الشحن'],['delivered','تم التوصيل']];
const $=id=>document.getElementById(id);
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};

  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===id));scrollTo(0,0);
  if(id!=='support'&&unS){unS();unS=null}
  if(unAM){unAM();unAM=null}
  ({favs:renderFavs,cart:renderCart,checkout:prepCheckout,orders:renderOrders,notif:renderNotif,me:renderMe,support:openSupport,admin:renderAdmin,updates:loadUpdates,wallet:renderWallet,addr:renderAddr,site:renderSite})[id]?.()}

/* ==================== المنتجات ==================== */
async function loadP(){
  const c=rd('pc',null);if(c&&c.i){P=Object.fromEntries(c.i.map(p=>[p.id,p]));loading=false;renderP()}
  try{const L=await Promise.any([fsList('products'),db.collection('products').get().then(s=>{const a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));return a})]);P={};L.forEach(p=>P[p.id]=p);wr('pc',{t:Date.now(),i:Object.values(P)})}
  catch(e){if(!Object.keys(P).length){$('grid').innerHTML='<div class="empty"><b>تعذّر تحميل المنتجات</b>تحقق من الاتصال ثم أعد المحاولة<br><br><button class="btn" style="width:auto" onclick="loadP()">إعادة المحاولة</button></div>';loading=false;return}}
  loading=false;renderP()}
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').trim();
let st;function debounce(){clearTimeout(st);st=setTimeout(renderP,150)}
function card(p){const f=favs.includes(p.id);return `<div class="pc" onclick="openP('${p.id}')"><div class="im"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>
 <button class="fav ${f?'on':''}" aria-label="مفضلة" onclick="event.stopPropagation();fav('${p.id}')">${f?'♥':'♡'}</button>
 <div class="in"><div class="n">${esc(p.name)}</div><div class="s">${esc(p.store)}</div><div class="row"><span class="pr">${money(p.price)}</span><button class="add" aria-label="أضف للسلة" onclick="event.stopPropagation();add('${p.id}')">+</button></div></div></div>`}
function renderP(){
  $('chips').innerHTML=CATS.map(([k,n])=>`<button class="chip ${cat===k?'on':''}" onclick="cat='${k}';renderP()">${n}</button>`).join('');
  let l=Object.values(P);if(cat!=='all')l=l.filter(p=>p.category===cat);
  const q=norm($('q').value);if(q)l=l.filter(p=>norm(p.name).includes(q)||norm(p.store).includes(q));
  const s=$('sort').value;l.sort((a,b)=>s==='lo'?a.price-b.price:s==='hi'?b.price-a.price:0);
  if(!l.length){$('grid').innerHTML=loading?'<div class="sk"></div>'.repeat(4):'<div class="empty"><b>لا توجد نتائج</b>جرّب كلمة بحث أخرى أو قسماً مختلفاً</div>';return}
  $('grid').innerHTML=l.map(card).join('')}
function renderFavs(){const l=favs.map(i=>P[i]).filter(Boolean);$('favGrid').innerHTML=l.length?l.map(card).join(''):'<div class="empty"><b>المفضلة فارغة</b>اضغط على القلب في أي منتج لحفظه هنا</div>'}
async function fav(id){const w=favs.includes(id);favs=w?favs.filter(x=>x!==id):[...favs,id];wr('favs',favs);
  if(user){const r=db.collection('users').doc(user.uid).collection('favorites').doc(id);try{w?await r.delete():await r.set({addedAt:Date.now()})}catch{}}
  renderP();if(cur==='favs')renderFavs();toast(w?'أُزيل من المفضلة':'أُضيف إلى المفضلة')}

/* ==================== تفاصيل المنتج ==================== */
function openP(id){const p=P[id];if(!p)return;let im=(p.images||[]).filter(Boolean);if(!im.length)im=[p.img||''];
  openSheet(`<div class="gal">${im.map(u=>u?`<img src="${esc(u)}" alt="${esc(p.name)}" onerror="this.outerHTML='<div class=noimg></div>'">`:'<div class="noimg"></div>').join('')}</div>
  <h2 style="margin-top:12px">${esc(p.name)}</h2><div style="color:var(--mu)">${esc(p.store)}</div>
  <div class="pr" style="font-size:26px;margin:8px 0">${money(p.price)}</div>

  <div id="rvs"></div>`);
  window.rate=5;drawStars();loadReviews(id)}
function drawStars(){$('stars').innerHTML=[1,2,3,4,5].map(i=>`<button class="st" style="font-size:26px" aria-label="${i} نجوم" onclick="rate=${i};drawStars()">${i<=rate?'★':'☆'}</button>`).join('')}
async function loadReviews(id){try{const s=await db.collection('products').doc(id).collection('reviews').orderBy('createdAt','desc').get();

  $('rvs').innerHTML=h;$('avg').textContent=(t/s.size).toFixed(1)+' ★'}catch{$('rvs').innerHTML='<div class="empty">تعذّر تحميل التقييمات</div>'}}
async function sendReview(id){if(!user){toast('سجّل دخولك أولاً لإضافة تقييم',1);closeSheet();return go('me')}

function add(id){if(!P[id])return;const i=cart.find(x=>x.id===id);i?i.qty++:cart.push({id,qty:1});saveCart();toast('أُضيف إلى السلة')}
function saveCart(){wr('cart',cart);const n=cart.reduce((s,i)=>s+i.qty,0);$('cb').textContent=n;$('cb').hidden=!n;if(cur==='cart')renderCart()}
function qty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x!==i);saveCart()}
const sub=()=>cart.reduce((s,i)=>s+(P[i.id]?.price||0)*i.qty,0);
const ship=()=>sub()>=FREE_SHIP||!cart.length?0:SHIP_FEE;
function renderCart(){const b=$('cartBox');
  if(!cart.length){b.innerHTML='<div class="empty"><b>سلتك فارغة</b>أضف منتجات لتظهر هنا<br><br><button class="btn" style="width:auto" onclick="go(\'home\')">تصفّح المنتجات</button></div>';return}

  cart.map(i=>{const p=P[i.id];if(!p)return'';return `<div class="card row"><img src="${esc(img(p))}" alt="" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="flex:1"><b style="font-size:14px">${esc(p.name)}</b><div style="color:var(--mu)">${money(p.price)}</div></div>

  `<div class="card"><div class="row"><span>المجموع</span><span>${money(s)}</span></div><div class="row"><span>الشحن</span><span>${ship()?money(ship()):'مجاني'}</span></div><div class="row" style="font-weight:800;font-size:18px;margin-top:6px"><span>الإجمالي</span><span>${money(s+ship())}</span></div></div>

function prepCheckout(){if(!cart.length)return go('cart');if(!user){toast('سجّل دخولك لإتمام الشراء',1);return go('me')}

async function placeOrder(){
  const m=$('pm').value,adr=$('adr').value.trim(),ph=getPhone('ph'),total=Math.max(0,sub()+ship()-(window.CP?CP.discount:0));
  if(!adr||!ph)return toast('أدخل العنوان ورقم الهاتف',1);
  if(!verified()){toast('وثّق رقم هاتفك أولاً لإتمام الطلب',1);return verifySheet()}
  if(!emailOk()){toast('أكّد بريدك الإلكتروني أولاً لإتمام الطلب',1);go('me');return emailSheet()}
  if(m==='wallet'&&user.balance<total)return toast('رصيدك غير كافٍ، اشحن محفظتك أو اختر الدفع عند الاستلام',1);
  const btn=$('payBtn');btn.disabled=true;btn.textContent='جارٍ إرسال الطلب...';
  try{const items=cart.map(i=>{const p=P[i.id]||{};return{productId:i.id,name:p.name||'',price:p.price||0,qty:i.qty,img:(u=>u.startsWith('data:')?'':u)(img(p))}});
    const o={userId:user.uid,userName:user.name,userEmail:user.email,items,subtotal:sub(),shipping:ship(),total,paymentMethod:m,address:adr,phone:ph,status:'pending',createdAt:Date.now(),...(window.CP?{coupon:CP.code,discount:CP.discount}:{}),...(window.LOC?{location:{lat:LOC.lat,lng:LOC.lng}}:{})};
    const oRef=db.collection('orders').doc();
    const uRef=db.collection('users').doc(user.uid),cp=window.CP,cRef=cp&&db.collection('coupons').doc(cp.code),usRef=cp&&cRef.collection('uses').doc(user.uid);
    if(m==='wallet'||cp){await db.runTransaction(async t=>{const u=m==='wallet'?await t.get(uRef):null;let c=null;
      if(cp){c=await t.get(cRef);const d=c.data()||{};if(!c.exists||d.active!==true||d.expiresAt<Date.now()||(d.usedCount||0)>=d.maxUses)throw Error('CPN');if((await t.get(usRef)).exists)throw Error('USED')}
      if(m==='wallet'){if((u.data()?.balance||0)<total)throw Error('LOW');t.update(uRef,{balance:u.data().balance-total})}
      if(cp){t.update(cRef,{usedCount:(c.data().usedCount||0)+1});t.set(usRef,{at:Date.now(),orderId:oRef.id})}
      t.set(oRef,o)})}
    else await oRef.set(o);
    db.collection('notifications').add({userId:user.uid,title:'تم استلام طلبك',body:`طلبك بقيمة ${money(total)} قيد المراجعة`,date:Date.now()}).catch(()=>{});
    cart=[];window.CP=null;saveCart();toast('تم تقديم الطلب بنجاح');go('orders')}
  catch(e){toast(e.message==='LOW'?'رصيدك غير كافٍ':e.message==='CPN'?'الكوبون لم يعد صالحاً':e.message==='USED'?'استخدمت هذا الكوبون من قبل':'تعذّر إتمام الطلب، حاول مرة أخرى',1)}
  finally{btn.disabled=false;btn.textContent='تأكيد الطلب'}}

.sl2 h2{font-size:24px;line-height:1.3;font-weight:800;max-width:14em}.sl2 p{opacity:.9;margin:6px 0 14px;font-size:14px}
.sl2.s1{background:linear-gradient(125deg,#6b4122,#9a6435 55%,#c8935a)}
.sl2.s2{background:linear-gradient(125deg,#3d5233,var(--ac2) 60%,#9bb38a)}
.sl2.s3{background:linear-gradient(125deg,var(--esp),#6b4122 55%,#c8935a)}
.sl2 .e{position:absolute;inset-inline-end:18px;top:14px;font-size:70px;opacity:.28}
.hdt{position:absolute;bottom:12px;inset-inline:0;display:flex;justify-content:center;gap:6px}
.hdt i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.5);transition:.3s}.hdt i.on{width:22px;background:#fff}
/* أقسام أفقية */
.hs{margin-bottom:18px}.hs h3{font-size:18px;color:var(--tx);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hs h3:after{content:"";width:34px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac2),transparent)}
.hr{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.hr .pc{flex:none;width:152px;scroll-snap-align:start;animation:none}
.grid.nr>.pc{animation:none}
/* شارات وتقييم */
.bdg{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;color:#fff}
.bdg.off{background:var(--red)}.bdg.nw{background:var(--ac2)}.bdg.low{background:#c8935a}.bdg.out{background:#6d6258}
.po{font-size:12px;color:var(--mu);text-decoration:line-through;margin-inline-start:6px;font-weight:400}
.rt{font-size:12px;color:var(--mu);margin:2px 0}.rt small{opacity:.8}
.pc .pr.sale{color:var(--ac2)}
.stp{display:flex;align-items:center;gap:6px;background:var(--ac2b);color:var(--ac2);border-radius:13px;padding:2px 4px;font-weight:800}
.stp button{width:28px;height:30px;font-size:19px;font-weight:800}
.fav.pop{animation:pop .45s}@keyframes pop{40%{transform:scale(1.35)}}
.fly{position:fixed;z-index:300;width:22px;height:22px;border-radius:50%;background:var(--ac2);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
/* بحث وفلاتر */
.bar{position:relative}
#fbtn{flex:none;width:48px;height:48px;border-radius:14px;background:var(--pri2);display:grid;place-items:center;position:relative}
#fbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#fbtn.act:after{content:"";position:absolute;top:8px;left:8px;width:9px;height:9px;border-radius:50%;background:var(--ac2)}
#sg{position:absolute;top:54px;inset-inline:0;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 16px 40px rgba(60,36,16,.2);padding:6px;display:none}
#sg.on{display:block}#sg button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;text-align:start;font-size:14px}
#sg button:active{background:var(--pri2)}#sg small{color:var(--mu);padding:6px 12px;display:block;font-weight:700}
/* تفاصيل المنتج */
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0}.dots i{width:7px;height:7px;border-radius:4px;background:var(--bd);transition:.3s}.dots i.on{width:20px;background:var(--pri)}
.sbar{position:sticky;bottom:-24px;margin:18px -20px -24px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:14px;align-items:center;z-index:3}
.sbar .btn{flex:1}.sbar small{display:block;color:var(--mu);font-size:11px}.sbar b{font-size:20px;color:var(--acc)}
.qb{display:inline-flex;align-items:center;gap:14px;background:var(--pri2);border-radius:14px;padding:4px 10px;font-weight:800}.qb button{font-size:22px;width:30px;height:32px}
.sheet .hr .pc{width:140px}
/* تبويبات: زر السلة بارز */
.tab[data-s=cart] svg{width:44px;height:44px;padding:11px;border-radius:50%;margin-top:-24px;background:linear-gradient(135deg,#8a5629,#b07a45);stroke:#fff;box-shadow:0 8px 18px rgba(122,77,40,.4);border:3px solid var(--bg)}
.tab[data-s=cart].on{background:none}.tab[data-s=cart] .dot{top:-24px}
/* الشحن المجاني */
.prog i{background:linear-gradient(90deg,var(--gold),var(--ac2))}
/* خط زمني عمودي للطلب */
.steps{display:block;border-inline-start:2px solid var(--bd);margin:12px 8px}
.steps span{display:flex;align-items:center;gap:10px;text-align:start;padding:5px 0;font-size:13px}
.steps span:before{margin:0 0 0 0;margin-inline-start:-8px;flex:none}
/* خطوات الدفع */
.cks{display:flex;margin:4px 0 16px}.cks span{flex:1;text-align:center;font-size:12px;color:var(--mu);position:relative}
.cks span:before{content:attr(data-n);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bd);margin:0 auto 4px;font-weight:800;color:var(--mu)}
.cks span.on:before{background:var(--pri);color:#fff}.cks span.dn:before{content:"✓";background:var(--ac2);color:#fff}.cks span.on,.cks span.dn{color:var(--tx);font-weight:700}
/* نجاح الطلب + التعريف */
.xo{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fade .3s}
.xo svg{width:110px;height:110px}.xo circle{fill:var(--ac2b);stroke:var(--ac2);stroke-width:3}
.xo path{fill:none;stroke:var(--ac2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .6s .3s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.xo h2{color:var(--acc);margin:14px 0 6px;font-size:24px}.xo p{color:var(--mu);max-width:20em;margin-bottom:22px}.xo .btn{max-width:320px}
.xo .big{font-size:84px;margin-bottom:6px}.xo .dt{display:flex;gap:7px;margin:16px 0 24px}.xo .dt i{width:8px;height:8px;border-radius:4px;background:var(--bd)}.xo .dt i.on{width:26px;background:var(--pri)}
</style>
<script id="x-js">
(function(){try{
const IC={all:'✨',gifts:'🎁',electronics:'📱',home:'🏠',beauty:'💄',toys:'🧸',cleaning:'🧼'};

card=function(p){

  const act=p.stock===0?'':c?`<div class="stp" onclick="event.stopPropagation()"><button aria-label="زيادة" onclick="qty('${p.id}',1)">+</button><span>${c.qty}</span><button aria-label="نقصان" onclick="qty('${p.id}',-1)">−</button></div>`:`<button class="add" aria-label="أضف للسلة" onclick="event.stopPropagation();add('${p.id}')">+</button>`;
  return `<div class="pc" onclick="openP('${p.id}')"><div class="im"><img src="${qa(img(p))}" alt="${qa(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>${bd}
  <button class="fav ${f?'on':''} ${window._pf===p.id?'pop':''}" aria-label="مفضلة" onclick="event.stopPropagation();fav('${p.id}')">${f?'♥':'♡'}</button>
  <div class="in"><div class="n">${esc(p.name)}</div><div class="s">${esc(p.store)}</div>${rt}<div class="row"><span class="pr ${d?'sale':''}">${money(p.price)}${d?`<span class="po">${money(p.oldPrice)}</span>`:''}</span>${act}</div></div></div>`};

/* الصفحة الرئيسية */
const sec=(t,l,id)=>l.length?`<div class="hs" ${id?`id="${id}"`:''}><h3>${t}</h3><div class="hr">${l.map(card).join('')}</div></div>`:'';
function secsHTML(){const a=Object.values(P);if(!a.length)return'';
  const deals=a.filter(p=>disc(p)).slice(0,8),nw=a.length>4?a.slice().sort((x,y)=>ct(y)-ct(x)).slice(0,8):[],rec=rd('rv',[]).map(i=>P[i]).filter(Boolean).slice(0,8);
  return sec('🔥 عروض اليوم',deals,'deals')+sec('وصل حديثاً',nw)+sec('شوهد مؤخراً',rec)}
function ensureUI(){
  if(!$('secs'))$('chips').insertAdjacentHTML('afterend','<div id="secs"></div>');
  if(!$('fbtn')){const b=document.querySelector('#home .bar');
    b.insertAdjacentHTML('beforeend','<button id="fbtn" aria-label="تصفية" onclick="openFilters()"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button><div id="sg"></div>');
    const q=$('q');q.addEventListener('focus',sugg);q.addEventListener('input',sugg);q.addEventListener('blur',()=>setTimeout(()=>$('sg').classList.remove('on'),180));
    q.addEventListener('change',()=>{const v=q.value.trim();if(v.length>1){const r=[v,...rd('rs',[]).filter(x=>x!==v)].slice(0,6);wr('rs',r)}});
    $('chips').className='cats'}}
function sugg(){const g=$('sg'),v=norm($('q').value);let h='';
  if(!v){const r=rd('rs',[]);if(r.length)h='<small>عمليات بحث سابقة</small>'+r.map(x=>`<button onmousedown="pickQ('${qa(x).replace(/'/g,"\\'")}')">🕘 ${esc(x)}</button>`).join('')}
  else{const m=Object.values(P).filter(p=>norm(p.name).includes(v)).slice(0,5);if(m.length)h='<small>اقتراحات</small>'+m.map(p=>`<button onmousedown="closeSg();openP('${p.id}')">🔎 ${esc(p.name)}</button>`).join('')}
  g.innerHTML=h;g.classList.toggle('on',!!h)}
window.pickQ=v=>{$('q').value=v;$('sg').classList.remove('on');renderP()};window.closeSg=()=>$('sg').classList.remove('on');
renderP=function(){
  $('chips').innerHTML=CATS.map(([k,n])=>`<button class="cat ${cat===k?'on':''}" onclick="cat='${k}';renderP()"><i>${IC[k]||'🛍️'}</i><span>${n}</span></button>`).join('');
  ensureUI();
  let l=Object.values(P);if(cat!=='all')l=l.filter(p=>p.category===cat);
  const q=norm($('q').value);if(q)l=l.filter(p=>norm(p.name).includes(q)||norm(p.store).includes(q));
  if(FL.min!=='')l=l.filter(p=>p.price>=+FL.min);if(FL.max!=='')l=l.filter(p=>p.price<=+FL.max);
  if(FL.store)l=l.filter(p=>p.store===FL.store);if(FL.deal)l=l.filter(disc);
  const s=$('sort').value;l.sort((a,b)=>s==='lo'?a.price-b.price:s==='hi'?b.price-a.price:0);
  $('fbtn').classList.toggle('act',fAct());
  $('secs').innerHTML=(q||cat!=='all'||fAct()||loading)?'':secsHTML();
  if(!l.length){$('grid').innerHTML=loading?'<div class="sk"></div>'.repeat(4):'<div class="empty"><b>لا توجد نتائج</b>جرّب كلمة بحث أخرى أو غيّر التصفية</div>';return}
  $('grid').innerHTML=l.map(card).join('');$('grid').classList.toggle('nr',!!window._rd);window._rd=true};
window.openFilters=function(){const st=[...new Set(Object.values(P).map(p=>p.store).filter(Boolean))];
  openSheet(`<h3>تصفية النتائج</h3><div class="fg"><label>السعر (من – إلى)</label><div class="row"><input id="fmin" type="number" inputmode="decimal" placeholder="0" value="${FL.min}"><input id="fmax" type="number" inputmode="decimal" placeholder="∞" value="${FL.max}"></div></div>
  <div class="fg"><label>المتجر</label><select id="fst"><option value="">الكل</option>${st.map(s=>`<option value="${qa(s)}" ${FL.store===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  <div class="fg"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fdl" ${FL.deal?'checked':''} style="width:20px;height:20px;padding:0"> العروض والخصومات فقط</label></div>
  <button class="btn" onclick="applyF()">عرض النتائج</button><button class="btn o" style="margin-top:8px" onclick="resetF()">مسح التصفية</button>`)};
window.applyF=()=>{FL={min:$('fmin').value,max:$('fmax').value,store:$('fst').value,deal:$('fdl').checked};closeSheet();renderP()};
window.resetF=()=>{FL={min:'',max:'',store:'',deal:false};closeSheet();renderP()};

/* سلايدر البانر */

  const d=s||{title:'مؤسسة الملك التجارية: كل ما تحتاجه بأفضل الأسعار',subtitle:`شحن مجاني للطلبات فوق $${FREE_SHIP}`,cta:'ابدأ البحث',image:'',active:true};

  const bg=d.image?` style="background:linear-gradient(125deg,rgba(107,65,34,.85),rgba(154,100,53,.6)),url('${esc(d.image)}') center/cover"`:'';

  `<div class="sl2 s2"><span class="e">🚚</span><h2>شحن مجاني</h2><p>لجميع الطلبات التي تتجاوز $${FREE_SHIP}</p></div>`,
  `<div class="sl2 s3"><span class="e">🔥</span><h2>عروض اليوم</h2><p>خصومات على منتجات مختارة</p><button class="btn w" onclick="var e=$('deals');e?e.scrollIntoView({behavior:'smooth'}):toast('لا توجد عروض حالياً')">شاهد العروض</button></div>`];

  tr.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;clearInterval(window._hi)},{passive:true});

  window._hi=setInterval(()=>go2(i+1),4800)};

/* حركات: طيران للسلة + نبضة القلب */
const _add=add;add=function(id){if(P[id]&&P[id].stock===0)return toast('نفدت الكمية',1);_add(id);fly()};
function fly(){const a=window._lt,t=document.querySelector('.tab[data-s=cart] svg');if(!a||!t||!a.getBoundingClientRect)return;
  const r=a.getBoundingClientRect(),e=t.getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=r.left+r.width/2-11+'px';d.style.top=r.top+r.height/2-11+'px';document.body.appendChild(d);
  d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${e.left+e.width/2-r.left-r.width/2}px,${e.top+e.height/2-r.top-r.height/2}px) scale(.3)`,opacity:.4}],{duration:650,easing:'cubic-bezier(.5,0,.8,.5)'}).onfinish=()=>d.remove()}
const _fav=fav;fav=function(id){window._pf=favs.includes(id)?null:id;setTimeout(()=>window._pf=null,700);return _fav(id)};
const _sc=saveCart;saveCart=function(){_sc();if(cur==='home')renderP();if(cur==='favs')renderFavs()};

/* تفاصيل المنتج */
window.pq=1;
openP=function(id){const p=P[id];if(!p)return;let im=(p.images||[]).filter(Boolean);if(!im.length)im=[p.img||''];
  wr('rv',[id,...rd('rv',[]).filter(x=>x!==id)].slice(0,12));pq=1;const d=disc(p),sim=Object.values(P).filter(x=>x.id!==id&&x.category===p.category).slice(0,6);
  openSheet(`<div class="gal" id="gal">${im.map(u=>u?`<img src="${qa(u)}" alt="${qa(p.name)}" onerror="this.outerHTML='<div class=noimg></div>'">`:'<div class="noimg"></div>').join('')}</div>
  <div class="dots" id="gd">${im.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
  <div class="row"><div style="min-width:0"><h2>${esc(p.name)}</h2><div style="color:var(--mu)">${esc(p.store)}</div></div><button class="ib" aria-label="مشاركة" onclick="shareP('${id}')"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button></div>
  <div style="margin:8px 0"><span class="pr ${d?'sale':''}" style="font-size:26px">${money(p.price)}</span>${d?`<span class="po" style="font-size:15px">${money(p.oldPrice)}</span> <b class="bdg off" style="position:static;display:inline-block">-${d}%</b>`:''}</div>
  ${p.stock===0?'<div style="color:var(--red);font-weight:700;margin-bottom:8px">نفدت الكمية</div>':p.stock>0&&p.stock<=5?`<div style="color:var(--ac2);font-weight:700;margin-bottom:8px">متبقي ${p.stock} قطع فقط</div>`:''}
  <p style="color:var(--mu);margin-bottom:14px">${esc(p.desc)}</p>
  <div class="row"><b>الكمية</b><div class="qb"><button aria-label="زيادة" onclick="pqc(1,'${id}')">+</button><span id="pqn">1</span><button aria-label="نقصان" onclick="pqc(-1,'${id}')">−</button></div></div>
  <h3 style="margin:18px 0 8px">التقييمات <span id="avg" class="st"></span></h3>
  <div class="card"><div id="stars" class="st" style="font-size:26px"></div><textarea id="rv" rows="2" placeholder="اكتب رأيك في المنتج" style="margin:8px 0"></textarea><button class="btn o" onclick="sendReview('${id}')">أرسل التقييم</button></div>
  <div id="rvs"></div>${sim.length?`<div class="hs" style="margin-top:16px"><h3>منتجات مشابهة</h3><div class="hr">${sim.map(card).join('')}</div></div>`:''}
  <div class="sbar"><div><small>الإجمالي</small><b id="pqt">${money(p.price)}</b></div><button class="btn" ${p.stock===0?'disabled':''} onclick="addN('${id}')">أضف إلى السلة</button></div>`);
  $('sheet').scrollTop=0;
  const g=$('gal');g.addEventListener('scroll',()=>{const k=Math.round(Math.abs(g.scrollLeft)/g.clientWidth);document.querySelectorAll('#gd i').forEach((e,j)=>e.classList.toggle('on',j===k))},{passive:true});
  window.rate=5;drawStars();loadReviews(id)};
window.pqc=(d,id)=>{const p=P[id];pq=Math.max(1,Math.min(p.stock>0?p.stock:99,pq+d));$('pqn').textContent=pq;$('pqt').textContent=money(p.price*pq)};
window.addN=id=>{const a=window._lt,i=cart.find(x=>x.id===id);i?i.qty+=pq:cart.push({id,qty:pq});saveCart();fly();toast('أُضيف إلى السلة');closeSheet()};
window.shareP=id=>{const p=P[id],t=`${p.name} — ${money(p.price)}`,u=SITE_URL||location.href;
  if(navigator.share)navigator.share({title:p.name,text:t,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(t+' '+u)}catch{}toast('تم نسخ الرابط')}};

<script id="x2-js">
(function(){try{
window.CP=null;window.LOC=null;
const CPE={off:'الكوبون غير مفعّل',exp:'انتهت صلاحية الكوبون',full:'اكتمل عدد العملاء المسموح لهذا الكوبون',used:'استخدمت هذا الكوبون من قبل'};
const clean=s=>s.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
function cpShow(){const m=$('cpm');if(!m)return;m.innerHTML=CP?`<div style="color:var(--ac2);font-weight:700;margin-top:6px">✓ خصم ${money(CP.discount)} (${esc(CP.code)})</div>`:'';$('due').textContent=money(Math.max(0,sub()+ship()-(CP?CP.discount:0)))}
window.applyCp=async function(){
  if(!user)return toast('سجّل دخولك أولاً',1);
  const code=clean($('cpi').value);if(!code)return toast('اكتب كود الخصم',1);
  const b=$('cpb');b.disabled=true;
  try{const r=db.collection('coupons').doc(code),d=await r.get();if(!d.exists)throw'x';const c=d.data();
    if(c.active!==true)throw'off';if(c.expiresAt<Date.now())throw'exp';if((c.usedCount||0)>=c.maxUses)throw'full';
    if((await r.collection('uses').doc(user.uid).get()).exists)throw'used';
    const s=sub(),v=Math.min(s,c.type==='percent'?s*c.value/100:c.value);
    CP={code,discount:Math.floor(v*100)/100};cpShow();toast('تم تطبيق الكوبون')}
  catch(e){CP=null;cpShow();toast(CPE[e]||'كود الخصم غير صحيح',1)}
  b.disabled=false};
/* الموقع */
function locShow(){['locm','locm2'].forEach(i=>{const m=$(i);if(m)m.textContent=LOC?'✓ تم تحديد موقعك على الخريطة':''})}
window.getLoc=function(tid,cid){
  if(!navigator.geolocation)return toast('جهازك لا يدعم تحديد الموقع',1);toast('جارٍ تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(async p=>{LOC={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};locShow();
    try{const c=new AbortController();setTimeout(()=>c.abort(),5000);const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ar&lat=${LOC.lat}&lon=${LOC.lng}`,{signal:c.signal}),a=(await r.json()).address||{};
      const city=a.city||a.town||a.village||a.state||'',st=[a.suburb||a.neighbourhood,a.road].filter(Boolean).join('، ');
      if(cid){if(city&&$(cid))$(cid).value=city;if(st&&$(tid))$(tid).value=st}else if($(tid)&&(city||st))$(tid).value=[city,st].filter(Boolean).join('، ')}catch{}
    toast('تم تحديد موقعك')},
  e=>toast(e.code===1?'اسمح للمتصفح بالوصول إلى موقعك ثم أعد المحاولة':'تعذّر تحديد الموقع',1),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})};
const _pc2=prepCheckout;prepCheckout=function(){CP=null;_pc2();const a=user&&user.address;if(a&&a.lat)LOC={lat:a.lat,lng:a.lng};
  if(!$('cpi')){$('payBtn').insertAdjacentHTML('beforebegin','<div class="fg"><label>كود الخصم</label><div class="row"><input id="cpi" dir="ltr" autocomplete="off" placeholder="CODE" style="text-transform:uppercase"><button class="btn o" id="cpb" style="width:auto;flex:none" onclick="applyCp()">تطبيق</button></div><div id="cpm"></div></div>');
    $('adr').closest('.fg').insertAdjacentHTML('afterend','<div class="fg"><button class="btn o" onclick="getLoc(\'adr\')">📍 حدد موقعي تلقائياً</button><div id="locm" style="font-size:12px;color:var(--ac2);margin-top:6px"></div></div>')}
  else{$('cpi').value='';cpShow()}locShow()};
const _ra=renderAddr;renderAddr=function(){_ra();if(!user)return;const a=user.address||{};if(a.lat)LOC={lat:a.lat,lng:a.lng};
  const sb=document.querySelector('#adrBox .card .btn');if(sb)sb.insertAdjacentHTML('beforebegin','<button class="btn o" style="margin-bottom:8px" onclick="getLoc(\'as\',\'ac\')">📍 حدد موقعي تلقائياً</button><div id="locm2" style="font-size:12px;color:var(--ac2);margin-bottom:10px"></div>');locShow()};
/* الإشعارات */
renderNotif=function(){const b=$('ntBox');if(unN){unN();unN=null}
  if(!user){b.innerHTML='<div class="empty"><b>سجّل دخولك</b>لعرض إشعاراتك</div>';return}
  wr('nseen',Date.now());nbd(0);
  unN=db.collection('notifications').where('userId','in',[user.uid,'all']).onSnapshot(s=>{
    if(s.empty){b.innerHTML='<div class="empty"><b>لا توجد إشعارات</b>ستظهر هنا عروضنا وتحديثات طلباتك</div>';return}
    const l=[];s.forEach(d=>l.push(d.data()));l.sort((a,b)=>b.date-a.date);
    b.innerHTML=l.map(n=>`<div class="card"><div class="row"><b>${esc(n.title)}</b><span style="color:var(--mu);font-size:11px;flex:none">${new Date(n.date).toLocaleDateString(LANG)}</span></div><div style="color:var(--mu);font-size:14px;margin-top:4px">${esc(n.body)}</div></div>`).join('')},()=>{b.innerHTML='<div class="empty">تعذّر تحميل الإشعارات</div>'})};
function nbd(n){const bt=document.querySelector('#home header button[onclick*="notif"]');if(!bt)return;let d=$('nbd');if(!d){bt.insertAdjacentHTML('beforeend','<span class="dot" id="nbd" hidden>0</span>');d=$('nbd')}d.textContent=n;d.hidden=!n}
let nl=null,nu=null;setInterval(()=>{const u=user&&user.uid;if(u===nu)return;nu=u;if(nl){nl();nl=null}nbd(0);if(!u)return;
  nl=db.collection('notifications').where('userId','in',[u,'all']).onSnapshot(s=>{const seen=rd('nseen',0);let n=0;s.forEach(d=>{if((d.data().date||0)>seen)n++});if(cur!=='notif')nbd(n)},()=>{})},1500);
/* لوحة الإدارة: الكوبونات */
window.genC=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
window.adCpn=async function(){const b=$('adBox');b.innerHTML=sk;
  let h=`<div class="card"><h3 style="margin-bottom:10px">كوبون جديد</h3><div class="fg"><label>الكود (تكتبه أنت)</label><div class="row"><input id="kc" dir="ltr" placeholder="VIP50"><button class="btn o" style="width:auto;flex:none" onclick="$('kc').value=genC()">توليد</button></div></div>
  <div class="row" style="gap:8px;align-items:flex-start"><div class="fg" style="flex:1"><label>النوع</label><select id="kt"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت $</option></select></div><div class="fg" style="flex:1"><label>القيمة</label><input id="kv" type="number" inputmode="decimal"></div></div>
  <div class="row" style="gap:8px;align-items:flex-start"><div class="fg" style="flex:1"><label>عدد العملاء المسموح</label><input id="km" type="number" value="1"></div><div class="fg" style="flex:1"><label>المدة (أيام)</label><input id="kd" type="number" value="7"></div></div>
  <button class="btn" onclick="saveCpn()">إنشاء الكوبون</button></div>`;
  try{const s=await db.collection('coupons').get(),l=[];s.forEach(d=>l.push({id:d.id,...d.data()}));l.sort((a,b)=>b.createdAt-a.createdAt);
    h+=l.map(c=>{const st=!c.active?'معطّل':c.expiresAt<Date.now()?'منتهي':(c.usedCount||0)>=c.maxUses?'مكتمل':'فعّال';
      return `<div class="card"><div class="row"><b dir="ltr" style="font-size:18px;letter-spacing:1px">${esc(c.id)}</b><span class="pill">${st}</span></div><div style="color:var(--mu);font-size:13px;margin:6px 0">${c.type==='percent'?c.value+'%':money(c.value)} · استُخدم ${c.usedCount||0} من ${c.maxUses} · ينتهي ${new Date(c.expiresAt).toLocaleDateString(LANG)}</div><div class="row" style="gap:8px"><button class="btn o" onclick="try{navigator.clipboard.writeText('${esc(c.id)}')}catch(e){}toast('تم نسخ الكود')">نسخ</button><button class="btn o" onclick="togCpn('${esc(c.id)}',${!c.active})">${c.active?'تعطيل':'تفعيل'}</button><button class="btn" style="background:var(--red)" onclick="delCpn('${esc(c.id)}')">حذف</button></div></div>`}).join('')}catch{h+=fail}
  b.innerHTML=h};
window.saveCpn=async()=>{const code=clean($('kc').value),v=+$('kv').value,m=Math.floor(+$('km').value),d=+$('kd').value,t=$('kt').value;
  if(code.length<3||!(v>0)||!(m>=1)||!(d>0)||(t==='percent'&&v>100))return toast('تحقق من بيانات الكوبون',1);
  try{const r=db.collection('coupons').doc(code);if((await r.get()).exists)return toast('هذا الكود موجود مسبقاً',1);
    await r.set({type:t,value:v,maxUses:m,usedCount:0,active:true,expiresAt:Date.now()+d*864e5,createdAt:Date.now()});toast('تم إنشاء الكوبون');adCpn()}catch{toast('تعذّر الإنشاء',1)}};
window.togCpn=async(id,a)=>{try{await db.collection('coupons').doc(id).update({active:a});adCpn()}catch{toast('تعذّر التعديل',1)}};
window.delCpn=async id=>{if(await ask('حذف الكوبون '+id+'؟','حذف'))try{await db.collection('coupons').doc(id).delete();adCpn()}catch{toast('تعذّر الحذف',1)}};
/* لوحة الإدارة: إرسال إشعار */
window.adPush=()=>{$('adBox').innerHTML=`<div class="card"><h3 style="margin-bottom:10px">إرسال إشعار</h3><div class="fg"><label>العنوان</label><input id="pt1" maxlength="80"></div><div class="fg"><label>النص</label><textarea id="pt2" rows="3" maxlength="300"></textarea></div><div class="fg"><label>المستلم (اختياري)</label><input id="pt3" type="email" dir="ltr" placeholder="بريد عميل محدد، أو اتركه فارغاً للجميع"></div><button class="btn" onclick="sendPush()">إرسال</button></div>`};
window.sendPush=async()=>{const t=$('pt1').value.trim(),b=$('pt2').value.trim(),e=$('pt3').value.trim();if(!t||!b)return toast('اكتب العنوان والنص',1);
  try{let uid='all';if(e){const q=await db.collection('users').where('email','==',e).limit(1).get();if(q.empty)return toast('لا يوجد عميل بهذا البريد',1);uid=q.docs[0].id}
    await db.collection('notifications').add({userId:uid,title:t,body:b,date:Date.now()});toast(e?'تم إرسال الإشعار':'تم إرسال الإشعار لجميع العملاء');$('pt1').value=$('pt2').value=$('pt3').value=''}catch{toast('تعذّر الإرسال',1)}};
}catch(e){console.error('x2-patch',e)}})();
</script>
